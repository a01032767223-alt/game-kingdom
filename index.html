<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1630">
<title>왕국 팡팡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd24a;--gold2:#ff9f1c;--ink:#fff;--sub:#b8c4e6;--royal:#16224a;--royal2:#0d1630;--line:rgba(255,215,110,.28);--red:#ff5d5d;--green:#55e07a;--blue:#58b4ff;--purple:#b57bff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;background:#070c1a;color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:radial-gradient(circle at 50% 25%,#1d2c57,#070c1a 70%)}
#stage{position:relative;overflow:hidden;font-size:calc(var(--sc,1)*16px);box-shadow:0 0 50px rgba(0,0,0,.7)}
canvas{display:block;touch-action:none}
.hide{display:none!important}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:.5em .5em;display:flex;gap:.3em;align-items:center;pointer-events:none}
.chip{background:rgba(9,14,32,.78);border:1px solid var(--line);border-radius:999px;padding:.2em .55em;font-size:.95em;display:flex;align-items:center;gap:.2em;white-space:nowrap}
.chip.bad{animation:shakeX .3s}
@keyframes shakeX{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.sp{flex:1}
.hbtn{pointer-events:auto;min-width:2.1em;height:2.1em;padding:0 .45em;border-radius:999px;background:rgba(9,14,32,.78);border:1px solid var(--line);font-size:.95em;display:grid;place-items:center}
#relicRow{position:absolute;top:2.7em;left:.55em;right:.55em;display:flex;flex-wrap:wrap;gap:.1em;font-size:.9em;pointer-events:none}
#bossBar{position:absolute;top:4.1em;left:14%;right:14%;pointer-events:none}
#bossBar .nm{text-align:center;font-size:.85em;color:#ffd5d5;text-shadow:0 1px 2px #000,0 0 6px #000}
#bossBar .bar{height:.6em;background:rgba(0,0,0,.65);border-radius:999px;overflow:hidden;border:1px solid rgba(255,120,120,.6)}
#bossFill{height:100%;width:100%;background:linear-gradient(90deg,#ff2f4f,#ff9a3b)}
#ultBtn{position:absolute;right:.7em;bottom:1.1em;width:4.3em;height:4.3em;border-radius:50%;padding:.26em;pointer-events:auto;background:conic-gradient(var(--gold) 1turn,rgba(0,0,0,.55) 0)}
#ultBtn .in{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#34437a,#141b38);font-size:1.6em;position:relative}
#ultBtn.ready .in{background:radial-gradient(circle at 40% 35%,#fff0a0,#ff9f1c);animation:pulse 1s infinite}
#ultLb{position:absolute;bottom:-1.25em;left:50%;transform:translateX(-50%);font-size:.4em;white-space:nowrap;text-shadow:0 1px 2px #000}
@keyframes pulse{50%{transform:scale(1.08)}}
#prep{position:absolute;left:40%;bottom:1.35em;transform:translateX(-50%);display:flex;align-items:center;gap:.45em;background:rgba(9,14,32,.85);border:1px solid var(--line);border-radius:999px;padding:.3em .35em .3em .85em;pointer-events:auto;font-size:.88em;white-space:nowrap}
#prep button{background:linear-gradient(#ffe066,#ffa51c);color:#4a2a00;border-radius:999px;padding:.38em .75em;font-size:.95em}
#toast{position:absolute;left:0;right:0;top:24%;text-align:center;font-size:1.6em;pointer-events:none;opacity:0;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.8);transition:opacity .3s,transform .3s;transform:scale(.8)}
#toast.on{opacity:1;transform:scale(1)}
#toast small{display:block;font-size:.55em;color:#ffe9a8}
/* overlays */
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1em;background:rgba(5,8,20,.72);pointer-events:auto;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.panel{width:100%;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:linear-gradient(180deg,#1b2a5c,#111a3a);border:2px solid var(--line);border-radius:1.1em;padding:1em;box-shadow:0 .6em 2em rgba(0,0,0,.5)}
.btn{display:block;width:100%;padding:.72em 1em;margin:.45em 0;border-radius:.9em;font-size:1.15em;background:linear-gradient(#ffe36e,#ffa51c);color:#4a2700;box-shadow:0 .25em 0 #b8650a,0 .45em .9em rgba(0,0,0,.35)}
.btn:active{transform:translateY(.15em);box-shadow:0 .1em 0 #b8650a}
.btn.blue{background:linear-gradient(#86c1ff,#3d76ef);color:#fff;box-shadow:0 .25em 0 #2443a0,0 .45em .9em rgba(0,0,0,.35)}
.btn.dark{background:linear-gradient(#3a4877,#26305a);color:#fff;box-shadow:0 .25em 0 #151b36,0 .45em .9em rgba(0,0,0,.35)}
.btn:disabled{filter:grayscale(1) brightness(.7)}
.sbtn{padding:.42em .75em;border-radius:.7em;font-size:.9em;background:linear-gradient(#ffe36e,#ffa51c);color:#4a2700;white-space:nowrap;box-shadow:0 .16em 0 #b8650a}
.sbtn.blue{background:linear-gradient(#86c1ff,#3d76ef);color:#fff;box-shadow:0 .16em 0 #2443a0}
.sbtn.gray{background:#3a4470;color:#c8d0ea;box-shadow:none}
.sbtn:disabled{filter:grayscale(1) brightness(.65)}
.top{display:flex;align-items:center;gap:.5em;margin-bottom:.7em}
.top h2{flex:1;font-size:1.35em;font-weight:normal;color:var(--gold)}
.back{width:2.2em;height:2.2em;border-radius:50%;background:#2a3768;font-size:1em}
.gem{background:rgba(0,0,0,.35);border-radius:999px;padding:.2em .6em;color:#9ee7ff}
/* title */
#sTitle{background:linear-gradient(180deg,rgba(7,12,30,.15),rgba(7,12,30,.82) 62%);justify-content:flex-end;padding-bottom:2.2em}
.logoWrap{position:absolute;top:13%;left:0;right:0;text-align:center}
.crown{font-size:3.3em;display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.12em) rotate(-4deg)}}
.logo{font-size:3.6em;line-height:1;background:linear-gradient(#fff6b8,#ffc533 55%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .07em 0 #6b3300) drop-shadow(0 .18em .25em rgba(0,0,0,.6))}
.subt{margin-top:.4em;color:#ffe7a6;font-size:1em;text-shadow:0 2px 3px #000}
.tmenu{width:86%}
.trow{display:flex;gap:.5em}
.trow .btn{font-size:1em}
.tfoot{display:flex;justify-content:space-between;align-items:center;width:86%;margin-top:.4em;color:var(--sub);font-size:.9em}
/* lists */
.row{display:flex;align-items:center;gap:.65em;padding:.62em;border-radius:.85em;background:rgba(0,0,0,.25);margin:.4em 0;border:1px solid rgba(255,255,255,.06)}
.row .ic{font-size:1.9em;width:1.4em;text-align:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .nm{font-size:1.02em}
.row .ds{font-size:.78em;color:var(--sub);line-height:1.35;margin-top:.12em}
.lv{display:flex;gap:.12em;margin-top:.25em}
.lv i{width:.55em;height:.55em;border-radius:50%;background:#3a4470;display:block}
.lv i.on{background:var(--gold)}
.mapc{position:relative;display:flex;align-items:center;gap:.7em;padding:.7em .8em;border-radius:.9em;margin:.45em 0;width:100%;text-align:left;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15),0 .2em .5em rgba(0,0,0,.35)}
.mapc .ic{font-size:2.1em;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.mapc .nm{font-size:1.1em;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.mapc .ds{font-size:.8em;opacity:.92;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.mapc.lock{filter:grayscale(.9) brightness(.55)}
.mapc .st{margin-left:auto;font-size:1.3em}
.sec{color:var(--gold);margin:.9em 0 .3em;font-size:1.05em}
/* pick */
#sPick h2{font-weight:normal;color:var(--gold);font-size:1.5em;text-shadow:0 2px 0 #000}
#sPick .sub2{color:var(--sub);font-size:.9em;margin:.2em 0 .7em}
.pc{display:flex;align-items:center;gap:.7em;width:100%;padding:.8em;margin:.4em 0;border-radius:1em;background:linear-gradient(180deg,#22305f,#172248);border:2px solid #8fa3c7;text-align:left;animation:pop .25s backwards}
.pc:nth-child(2){animation-delay:.06s}.pc:nth-child(3){animation-delay:.12s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.pc .ic{font-size:2.2em;width:1.3em;text-align:center}
.pc .nm{font-size:1.08em}
.pc .ds{font-size:.82em;color:#d5ddf5;margin-top:.15em;line-height:1.35}
.pc .rt{font-size:.68em;padding:.1em .45em;border-radius:999px;margin-left:.3em;vertical-align:middle}
.r0{border-color:#8fa3c7}.r0 .rt{background:#5a6a8f}
.r1{border-color:#58b4ff;box-shadow:0 0 .8em rgba(88,180,255,.35)}.r1 .rt{background:#2f74c8}
.r2{border-color:#c084ff;box-shadow:0 0 1em rgba(192,132,255,.45)}.r2 .rt{background:#7c3aed}
.r3{border-color:#ffd24a;box-shadow:0 0 1.1em rgba(255,210,74,.5)}.r3 .rt{background:#c27a00}
/* build sheet */
#sBuild{justify-content:flex-end;padding:0;background:rgba(0,0,0,.25)}
#sBuild .panel{border-radius:1.2em 1.2em 0 0;max-height:60%;border-bottom:none;padding:.85em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.45em}
.tb{display:flex;align-items:center;gap:.45em;padding:.55em;border-radius:.8em;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1);text-align:left}
.tb .ic{font-size:1.65em}
.tb .nm{font-size:.95em}
.tb .ds{font-size:.7em;color:var(--sub);line-height:1.25}
.tb .cs{font-size:.82em;color:var(--gold)}
.tb:disabled{opacity:.45}
.tb.cant .cs{color:var(--red)}
.stat{display:flex;gap:.4em;flex-wrap:wrap;margin:.5em 0;font-size:.85em}
.stat span{background:rgba(0,0,0,.3);padding:.2em .55em;border-radius:999px}
.acts{display:flex;gap:.45em;margin-top:.5em}
.acts .sbtn{flex:1;padding:.65em .4em;font-size:.95em}
.result h1{font-size:2.6em;font-weight:normal;text-align:center}
.result .big{text-align:center;font-size:3.5em}
.kv{display:flex;justify-content:space-between;padding:.4em .2em;border-bottom:1px dashed rgba(255,255,255,.12)}
.unlock{margin-top:.6em;padding:.6em;border-radius:.8em;background:rgba(255,210,74,.15);border:1px solid var(--line);color:#ffe9a6;font-size:.9em;text-align:center}
.tabs{display:flex;gap:.3em;margin-bottom:.5em;flex-wrap:wrap}
.tabs button{padding:.35em .7em;border-radius:999px;background:#2a3768;font-size:.85em}
.tabs button.on{background:var(--gold);color:#4a2700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div class="chip" id="cCastle">🏰 <span id="hCastle">20</span></div>
  <div class="chip">💰 <span id="hCoin">0</span></div>
  <div class="chip">🌊 <span id="hWave">0/15</span></div>
  <div class="sp"></div>
  <button class="hbtn" id="bSpeed">1x</button>
  <button class="hbtn" id="bPause">⏸</button>
</div>
<div id="relicRow" class="hide"></div>
<div id="bossBar" class="hide"><div class="nm" id="bossName"></div><div class="bar"><div id="bossFill"></div></div></div>
<div id="prep" class="hide"><span id="prepTxt"></span><button id="bGo">▶ 바로 시작</button></div>
<button id="ultBtn" class="hide" aria-label="필살기"><div class="in"><span id="ultIc">🌀</span><span id="ultLb"></span></div></button>
<div id="toast"></div>

<!-- 타이틀 -->
<div id="sTitle" class="ov">
  <div class="logoWrap"><div class="crown">👑</div><div class="logo">왕국 팡팡</div><div class="subt">영웅이 직접 뛰는 성 지키기 디펜스</div></div>
  <div class="tmenu">
    <button class="btn" id="bPlay">⚔️ 출전하기</button>
    <div class="trow"><button class="btn blue" id="bHero">🦸 영웅</button><button class="btn blue" id="bShop">🛠️ 강화</button></div>
    <button class="btn dark" id="bCodex">📖 도감</button>
  </div>
  <div class="tfoot"><span class="gem" id="tGem">💎 0</span><button id="bSound" class="sbtn gray">🔊 소리 켜짐</button></div>
</div>

<div id="sMaps" class="ov hide"><div class="panel">
  <div class="top"><button class="back" data-back>◀</button><h2>전장 선택</h2><span class="gem gemv"></span></div>
  <div class="row" id="heroNow"></div>
  <div id="mapList"></div>
</div></div>

<div id="sHeroes" class="ov hide"><div class="panel">
  <div class="top"><button class="back" data-back>◀</button><h2>영웅</h2><span class="gem gemv"></span></div>
  <div id="heroList"></div>
</div></div>

<div id="sShop" class="ov hide"><div class="panel">
  <div class="top"><button class="back" data-back>◀</button><h2>영구 강화</h2><span class="gem gemv"></span></div>
  <div style="font-size:.8em;color:var(--sub)">보석은 웨이브를 막고 보스를 쓰러뜨리면 얻습니다. 강화는 모든 판에 적용됩니다.</div>
  <div id="shopList"></div>
</div></div>

<div id="sCodex" class="ov hide"><div class="panel">
  <div class="top"><button class="back" data-back>◀</button><h2>도감</h2></div>
  <div class="tabs" id="codexTabs"></div>
  <div id="codexList"></div>
</div></div>

<div id="sBuild" class="ov hide"><div class="panel" id="buildPanel"></div></div>

<div id="sPick" class="ov hide">
  <h2 id="pickTitle">보상 선택</h2><div class="sub2" id="pickSub"></div>
  <div id="pickCards" style="width:100%"></div>
  <button class="sbtn blue" id="bReroll" style="margin-top:.6em">🔄 새로고침</button>
</div>

<div id="sPause" class="ov hide"><div class="panel">
  <div class="top"><h2>일시정지</h2></div>
  <div id="pauseInfo"></div>
  <button class="btn" id="bResume">▶ 계속하기</button>
  <button class="btn dark" id="bSound2">🔊 소리</button>
  <button class="btn dark" id="bQuit">🏳️ 포기하고 나가기</button>
</div></div>

<div id="sResult" class="ov hide"><div class="panel result" id="resultPanel"></div></div>
</div></div>

<script>
'use strict';
/* ================= 기본 ================= */
const W=400,H=720,CASTLE={x:200,y:690};
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let SC=1;const DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){const wr=$('wrap'),cs=getComputedStyle(wr);const aw=wr.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);const ah=wr.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);SC=Math.min(aw/W,ah/H);const st=$('stage');st.style.width=W*SC+'px';st.style.height=H*SC+'px';cv.style.width=W*SC+'px';cv.style.height=H*SC+'px';cv.width=Math.round(W*SC*DPR);cv.height=Math.round(H*SC*DPR);document.documentElement.style.setProperty('--sc',SC)}
addEventListener('resize',resize);
const R=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hyp=Math.hypot;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shade(hex,p){const n=parseInt(hex.slice(1),16);const f=v=>Math.round(clamp(p<0?v*(1+p):v+(255-v)*p,0,255));return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
function wpick(list,wf){let s=0;for(const x of list)s+=wf(x);let r=Math.random()*s;for(const x of list){r-=wf(x);if(r<=0)return x}return list[list.length-1]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* 이모지 스프라이트 캐시 */
const SPR={};
function spr(e,s){const k=e+'|'+Math.round(s);let c=SPR[k];if(c)return c;c=document.createElement('canvas');const r=3,sz=Math.ceil(s*1.5*r);c.width=c.height=sz;const g=c.getContext('2d');g.font=`${s*r}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,sz/2,sz/2+s*r*.08);SPR[k]=c;return c}
function drawE(e,x,y,s,flip,alpha){const c=spr(e,s),d=s*1.5;if(flip||alpha!=null){ctx.save();if(alpha!=null)ctx.globalAlpha*=alpha;ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(c,-d/2,-d/2,d,d);ctx.restore()}else ctx.drawImage(c,x-d/2,y-d/2,d,d)}

/* ================= 저장 ================= */
let save={gems:0,up:{},heroes:{knight:1},hero:'knight',cleared:0,best:{},sound:1,tut:0};
try{const s=JSON.parse(localStorage.getItem('kingdomPangpang_v1'));if(s)save=Object.assign(save,s)}catch(e){}
function store(){try{localStorage.setItem('kingdomPangpang_v1',JSON.stringify(save))}catch(e){}}

/* ================= 소리 ================= */
let AC=null;const lastS={};
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function sfx(key,f,d=.08,type='square',v=.05,slide=0){if(!save.sound||!AC)return;const now=AC.currentTime;if(lastS[key]&&now-lastS[key]<.05)return;lastS[key]=now;try{if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,now);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),now+d);g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(.0001,now+d);o.connect(g);g.connect(AC.destination);o.start(now);o.stop(now+d+.03)}catch(e){}}
function tune(notes,step=.11,type='triangle',v=.06){notes.forEach((n,i)=>setTimeout(()=>sfx('tune'+i+Math.random(),n,.16,type,v),i*step*1000))}

/* ================= 데이터 ================= */
const MAPS=[
{n:'푸른 초원',e:'🌿',g1:'#4f9a45',g2:'#5fae52',p1:'#dcc48e',p2:'#b4945d',deco:['🌳','🌲','🌼','🪨','🌷'],boss:'ogre',base:1,grow:.16,seed:11,d:'모험이 시작되는 평화로운 들판',paths:[[[200,-20],[200,120],[90,180],[90,300],[310,360],[310,480],[200,540],[200,700]]]},

/* ================= 경로 ================= */
function mkPath(pts){const segs=[];let tot=0;for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];const l=hyp(b[0]-a[0],b[1]-a[1]);segs.push({a,b,l,s:tot,ang:Math.atan2(b[1]-a[1],b[0]-a[0])});tot+=l}return{pts,segs,tot}}
function posAt(p,d){if(d<=0){const s=p.segs[0];return{x:s.a[0],y:s.a[1],ang:s.ang}}for(const s of p.segs){if(d<=s.s+s.l){const t=(d-s.s)/s.l;return{x:s.a[0]+(s.b[0]-s.a[0])*t,y:s.a[1]+(s.b[1]-s.a[1])*t,ang:s.ang}}}const s=p.segs[p.segs.length-1];return{x:s.b[0],y:s.b[1],ang:s.ang}}
function segProj(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const L=dx*dx+dy*dy;let t=L?((px-a[0])*dx+(py-a[1])*dy)/L:0;t=clamp(t,0,1);return{x:a[0]+dx*t,y:a[1]+dy*t}}
function segDist(px,py,a,b){const q=segProj(px,py,a,b);return hyp(px-q.x,py-q.y)}
function nearestPathPt(x,y){let best=null,bd=1e9;for(const p of G.paths)for(const s of p.segs){const q=segProj(x,y,s.a,s.b);const d=hyp(q.x-x,q.y-y);if(d<bd&&q.y>0&&q.x>0&&q.x<W){bd=d;best=q}}return best||{x,y}}
function genSpots(paths){const spots=[];const segs=paths.flatMap(p=>p.segs);const ok=(x,y)=>{if(x<26||x>374||y<60||y>640)return false;if(hyp(x-CASTLE.x,y-CASTLE.y)<72)return false;for(const s of segs)if(segDist(x,y,s.a,s.b)<40)return false;for(const o of spots)if(hyp(o.x-x,o.y-y)<54)return false;return true};
  for(const p of paths)for(let d=30;d<p.tot;d+=38){const a=posAt(p,d);const nx=-Math.sin(a.ang),ny=Math.cos(a.ang);for(const sg of[1,-1]){const x=a.x+nx*48*sg,y=a.y+ny*48*sg;if(ok(x,y))spots.push({x,y,t:null})}}return spots}

function makeBg(M,paths,spots){const r=2,c=document.createElement('canvas');c.width=W*r;c.height=H*r;const g=c.getContext('2d');g.scale(r,r);const rnd=rng(M.seed);
  g.fillStyle=M.g1;g.fillRect(0,0,W,H);
  for(let i=0;i<230;i++){g.globalAlpha=.3+rnd()*.35;g.fillStyle=rnd()<.5?M.g2:shade(M.g1,-.08);g.beginPath();g.ellipse(rnd()*W,rnd()*H,8+rnd()*34,5+rnd()*18,rnd()*3,0,7);g.fill()}
  g.globalAlpha=1;g.strokeStyle=shade(M.g1,-.2);g.lineWidth=1.1;
  for(let i=0;i<170;i++){const x=rnd()*W,y=rnd()*H;g.beginPath();g.moveTo(x,y);g.lineTo(x-2,y-5);g.moveTo(x,y);g.lineTo(x+2,y-5);g.stroke()}
  g.lineCap='round';g.lineJoin='round';
  const tr=p=>{g.beginPath();p.pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]))};
  if(M.glow){g.shadowColor=M.glow;g.shadowBlur=18}
  for(const p of paths){tr(p);g.strokeStyle=M.p2;g.lineWidth=40;g.stroke()}
  g.shadowBlur=0;
  for(const p of paths){tr(p);g.strokeStyle=M.p1;g.lineWidth=31;g.stroke()}
  for(const p of paths){tr(p);g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=12;g.stroke()}
  for(const p of paths)for(let d=0;d<p.tot;d+=13){const q=posAt(p,d);g.fillStyle='rgba(0,0,0,.13)';g.beginPath();g.arc(q.x+(rnd()-.5)*24,q.y+(rnd()-.5)*24,1+rnd()*1.6,0,7);g.fill()}
  const segs=paths.flatMap(p=>p.segs);const ds=[];
  for(let i=0;i<160&&ds.length<48;i++){const x=10+rnd()*(W-20),y=46+rnd()*(H-70);let ok=hyp(x-CASTLE.x,y-CASTLE.y)>75;if(ok)for(const s of segs)if(segDist(x,y,s.a,s.b)<30){ok=false;break}if(ok)for(const sp of spots)if(hyp(sp.x-x,sp.y-y)<30){ok=false;break}if(ok)ds.push({x,y,e:M.deco[Math.floor(rnd()*M.deco.length)],s:14+rnd()*12})}
  ds.sort((a,b)=>a.y-b.y);for(const d of ds){g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(d.x,d.y+d.s*.45,d.s*.42,d.s*.14,0,0,7);g.fill();const w=d.s*1.5;g.drawImage(spr(d.e,d.s),d.x-w/2,d.y-w/2,w,w)}
  const vg=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.78);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.38)');g.fillStyle=vg;g.fillRect(0,0,W,H);
  return c}

function hpMul(n){const M=G.M;return M.base*(1+M.grow*(n-1)+.01*(n-1)*(n-1))}

/* ================= 웨이브 ================= */
function genWave(n){const mi=G.mi;const pool=Object.keys(ET).filter(k=>ET[k].from&&ET[k].from<=n+mi);
  let budget=(9+n*4.3)*(1+mi*.12);const list=[];let boss=null;
  if(n===15){boss={k:G.M.boss,boss:2};budget*=.6}else if(n===10){boss={k:'bear',boss:1};budget*=.75}else if(n===5){boss={k:'rhino',boss:1};budget*=.75}
  const fast=1-Math.min(.4,n*.022);
  while(budget>0){const k=wpick(pool,x=>ET[x].w*(ET[x].from>=n+mi-2?1.6:1));const pack=Math.random()<.35?Math.floor(R(3,6)):1;for(let i=0;i<pack&&budget>0;i++){list.push({k,delay:(pack>1?.3:R(.45,.95))*fast});budget-=ET[k].cost}}
  if(boss){boss.delay=2;list.splice(Math.floor(list.length*.4),0,boss)}
  return list}
function startWave(){if(G.state!=='prep')return;G.wave++;G.state='wave';G.spawnQ=genWave(G.wave);G.spawnT=.6;hide('prep');
  const b=G.spawnQ.find(q=>q.boss);toast(`웨이브 ${G.wave}`,b?`⚠️ ${ET[b.k].n} 등장 예정!`:G.wave===1?'적이 몰려옵니다!':'');sfx('wv',440,.25,'square',.05,220)}
function endWave(){G.state='reward';
  for(const c of G.coins)G.coinsN+=c.v;G.coins=[];
  const m=G.mods;if(m.interest){const v=Math.min(60,Math.floor(G.coinsN*m.interest));G.coinsN+=v;if(v)text(CASTLE.x,CASTLE.y-60,'이자 +'+v,'#ffe066',14)}
  if(m.waveHeal)G.castle=Math.min(G.castleMax,G.castle+m.waveHeal);
  G.gems+=1+Math.floor(G.mi/2);
  if(G.wave>=15){finishRun(true);return}
  tune([659,784,988]);
  setTimeout(()=>{if(!G||G.state!=='reward')return;if(G.wave%5===0)showPick('relic');else showPick('card')},650)}
function toPrep(){G.state='prep';G.prepT=12;show('prep')}

function spawnEnemy(k,o={}){const T=ET[k];const path=o.path||G.paths[Math.floor(Math.random()*G.paths.length)];const hm=o.hm||hpMul(Math.max(1,G.wave));const hp=T.hp*hm;const d=o.d||0;const p=posAt(path,d);
  const e={k,T,path,d,x:p.x,y:p.y,hp,maxHp:hp,sp:T.sp*R(.92,1.08),arm:T.arm||0,mres:T.mres||0,fly:!!T.fly,size:T.size*(T.boss?1.2:1.45),boss:T.boss||0,abT:3,slowT:0,slow:0,frozen:0,stun:0,burn:0,burnT:0,pois:0,poisT:0,flash:0,hitCd:0,atkCd:0,shootCd:R(1,2.5),healCd:2,face:1,bob:Math.random()*6,blk:null,chargeT:0,burrowT:0,reviveT:0,dead:0};
  G.enemies.push(e);return e}
function spawnFromQ(q){let hm;if(q.boss===2)hm=G.M.base*1.6;else if(q.boss===1)hm=hpMul(G.wave)*.55;const e=spawnEnemy(q.k,{hm});if(q.boss){G.boss=e;show('bossBar');$('bossName').textContent=(q.boss===2?'👑 ':'⚔️ ')+ET[q.k].n;toast('⚠️ 보스 등장!',ET[q.k].n);shake(.5,6);sfx('boss',90,.6,'sawtooth',.08,-40)}}

const alive=e=>!e.dead&&!(e.reviveT>0);
const tgtable=e=>alive(e)&&!(e.burrowT>0);
function hurt(e,amt,kind,o={}){if(!tgtable(e))return;const m=G.mods;let a=amt;
  if(kind==='phys')a*=1-Math.max(0,e.arm-m.pierce);else if(kind==='magic')a*=1-e.mres;
  if(e.slowT>0||e.frozen>0)a*=m.slowDmg;
  if(!o.dot&&m.crit&&Math.random()<m.crit){a*=2;text(e.x,e.y-e.size*.7,Math.round(a)+'!','#ffdf3a',13)}
  e.hp-=a;if(!o.dot)e.flash=.08;
  if(o.leech&&m.leech){const h=G.hero;h.hp=Math.min(h.maxHp,h.hp+a*m.leech)}
  if(m.execute&&!e.boss&&e.hp>0&&e.hp<e.maxHp*.15){e.hp=0;text(e.x,e.y-14,'처형!','#ff6b6b',11)}
  if(e.hp<=0)kill(e)}
function kill(e){if(e.dead)return;const m=G.mods;
  if(e.T.revive&&!e.revived){e.revived=1;e.reviveT=2.5;e.hp=e.maxHp*.5;e.burnT=0;e.poisT=0;e.slowT=0;puff(e.x,e.y,'#ddd',6,40);return}
  e.dead=1;G.kills++;
  const v=Math.max(1,Math.round(e.T.coin*(1+G.wave*.03)*m.coin+m.coinFlat));dropCoins(e.x,e.y,v);
  if(e.boss){for(let i=0;i<(e.boss===2?3:2);i++)dropItem(e.x+R(-25,25),e.y+R(-20,20));G.gems+=e.boss===2?15:5;if(G.boss===e){G.boss=null;hide('bossBar')}shake(.6,8);tune([392,523,659,784,1047],.09,'square',.05);boom(e.x,e.y,70,'255,210,90')}
  else if(Math.random()<.025*m.item)dropItem(e.x,e.y);
  puff(e.x,e.y,e.T.fly?'#c9b6ff':'#fff',7,70);
  if(e.T.split){for(const s of[-7,7])spawnEnemy('minislime',{path:e.path,d:Math.max(0,e.d+s),hm:hpMul(Math.max(1,G.wave))})}
  if(e.plague&&e.pois>0){for(const o of G.enemies)if(o!==e&&tgtable(o)&&hyp(o.x-e.x,o.y-e.y)<55){o.pois=Math.max(o.pois,e.pois*.7);o.poisT=4;o.plague=1}G.fx.push({t:'ring',x:e.x,y:e.y,r:0,R:55,life:.35,max:.35,c:'120,230,90'})}
  if(m.explode&&!e.exploding&&Math.random()<m.explode){e.exploding=1;explode(e.x,e.y,48,30+G.wave*8)}
  sfx('kill',220,.05,'triangle',.03,-100)}
function explode(x,y,r,dmg){boom(x,y,r,'255,150,60');for(const o of G.enemies)if(tgtable(o)&&hyp(o.x-x,o.y-y)<=r+o.size*.3)hurt(o,dmg*G.mods.dmg,'fire');sfx('boom',110,.22,'sawtooth',.06,-70)}
function dropCoins(x,y,v){const n=v>=20?4:v>=8?3:v>=3?2:1;let rest=v;for(let i=0;i<n;i++){const c=i===n-1?rest:Math.floor(v/n);rest-=c;if(c<=0)continue;G.coins.push({x:x+R(-4,4),y:y+R(-3,3),v:c,vx:R(-45,45),vy:R(-25,25),z:0,vz:R(70,120),t:0,fly:0})}}

/* ================= 타워 ================= */
function tst(t){const b=TT[t.k],m=G.mods;const L=LV[t.lv-1];const dmg=b.dmg*L*m.td[t.k]*m.tdmg*m.dmg*(t.buff||1);
  const rate=b.rate/(m.trate*(1+(t.rbuff||0))*(G.buffs.rage>0?1.5:1)*(t.near?1.3:1));let range=b.rng*(1+.07*(t.lv-1))*m.trng;if(t.lv===4)range*=1.1;return{dmg,rate,range}}
function costOf(k,lv){const c=TT[k].c*G.mods.cost;if(lv===0)return Math.round(c);if(lv===1)return Math.round(c*.75);if(lv===2)return Math.round(c*1.1);return Math.round(c*1.8)}
function inRange(x,y,r,ground){const L=[];for(const e of G.enemies){if(!tgtable(e))continue;if(ground&&e.fly)continue;if(hyp(e.x-x,e.y-y)<=r+e.size*.3)L.push(e)}L.sort((a,b)=>(a.path.tot-a.d)-(b.path.tot-b.d));return L}
function lunge(o,tx,ty,d,dur=.22){o.lgA=Math.atan2(ty-o.y,tx-o.x);o.lgS=G.time;o.lgD=d;o.lgDur=dur}
function lgOff(o){if(o.lgS==null)return{x:0,y:0};const k=(G.time-o.lgS)/(o.lgDur||.22);if(k<0||k>1)return{x:0,y:0};const v=Math.sin(Math.PI*k)*o.lgD;return{x:Math.cos(o.lgA)*v,y:Math.sin(o.lgA)*v}}
function shoot(t,e,o){lunge(t,e.x,e.y,6);t.aimA=t.lgA;G.projs.push(Object.assign({x:t.x+Math.cos(t.aimA)*14,y:t.y-6+Math.sin(t.aimA)*10,tgt:e,tx:e.x,ty:e.y,life:2,from:t},o));t.anim=1}
function status(e,p){const m=G.mods;

function hit(p){
  if(p.splash){G.fx.push({t:'boom',x:p.tx,y:p.ty,r:p.splash,life:.3,max:.3,c:p.bc||'255,170,60'});puff(p.tx,p.ty,p.bc?`rgb(${p.bc})`:'#ffb347',6,80);
    for(const e of G.enemies){if(!tgtable(e)||(p.ground&&e.fly))continue;if(hyp(e.x-p.tx,e.y-p.ty)<=p.splash+e.size*.3){hurt(e,p.dmg,p.kind,{leech:p.hero});if(alive(e))status(e,p)}}
    if(!p.hero)sfx('bm',120,.12,'square',.03,-60)}
  else{const e=p.tgt;if(e&&tgtable(e)&&hyp(e.x-p.x,e.y-p.y)<30){hurt(e,p.dmg,p.kind,{leech:p.hero});if(alive(e))status(e,p);if(p.bounce)chain(e,p.bounce,p.dmg*.9);if(p.type==='shard')puff(e.x,e.y,'#cdeeff',3,30,2)}}}
function updProjs(dt){
  for(const p of G.projs){if(p.tgt&&tgtable(p.tgt)){p.tx=p.tgt.x;p.ty=p.tgt.y}const dx=p.tx-p.x,dy=p.ty-p.y,L=hyp(dx,dy),st=p.sp*dt;if(p.rot!=null)p.rot+=dt*20;
    if(L<=st+4){p.x=p.tx;p.y=p.ty;hit(p);p.done=1}else{p.x+=dx/L*st;p.y+=dy/L*st;p.ang=Math.atan2(dy,dx)}p.life-=dt;if(p.life<=0)p.done=1}
  G.projs=G.projs.filter(p=>!p.done);
  const h=G.hero;for(const p of G.eproj){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(!h.dead&&hyp(p.x-h.x,p.y-h.y)<16){heroHurt(p.dmg);p.life=0}}G.eproj=G.eproj.filter(p=>p.life>0);
  if(G.rain){const r=G.rain;r.t-=dt;while(r.t<=0&&r.n>0){r.t+=.055;r.n--;const L=G.enemies.filter(tgtable);if(L.length){const e=L[Math.floor(Math.random()*L.length)];hurt(e,r.dmg,'phys');G.fx.push({t:'streak',x:e.x,y:e.y,life:.18,max:.18})}else{const x=R(40,360),y=R(120,620);G.fx.push({t:'streak',x,y,life:.18,max:.18})}}if(r.n<=0)G.rain=null}
  for(const mt of G.meteors){mt.t-=dt;if(mt.t<=0){mt.done=1;boom(mt.x,mt.y,65,'255,120,40');shake(.2,4);sfx('mt',90,.3,'sawtooth',.07,-50);for(const e of G.enemies)if(tgtable(e)&&hyp(e.x-mt.x,e.y-mt.y)<65+e.size*.3){hurt(e,mt.dmg*G.mods.magic,'magic');if(alive(e))status(e,{burn:mt.dmg*.1})}}}G.meteors=G.meteors.filter(m=>!m.done)}
function updCoins(dt){const h=G.hero,m=G.mods;
  for(const c of G.coins){c.t+=dt;if(c.z>0||c.vz>0){c.z+=c.vz*dt;c.vz-=320*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;if(c.z<=0){c.z=0;c.vz=0}}
    if(h.dead>0)continue;const d=hyp(c.x-h.x,c.y-h.y);if(d<m.magnet||c.fly){c.fly=1;const sp=420*dt;if(d<14){G.coinsN+=c.v;c.got=1;sfx('coin',1250+Math.random()*200,.05,'triangle',.03);continue}c.x+=(h.x-c.x)/d*Math.min(d,sp);c.y+=(h.y-c.y)/d*Math.min(d,sp)}}
  G.coins=G.coins.filter(c=>!c.got&&c.t<28);
  for(const it of G.items){it.t-=dt;it.b+=dt;if(!h.dead&&hyp(it.x-h.x,it.y-h.y)<28){it.got=1;useItem(it)}}G.items=G.items.filter(i=>!i.got&&i.t>0)}
function useItem(it){const h=G.hero,m=G.mods;text(h.x,h.y-40,it.e+' '+it.n,'#fff59a',14);tune([880,1175],.07,'square',.04);
  switch(it.k){case'magnet':for(const c of G.coins)c.fly=1;break;
  case'bomb':boom(h.x,h.y,160,'255,140,40');shake(.4,7);for(const e of G.enemies)if(tgtable(e)&&hyp(e.x-h.x,e.y-h.y)<160)hurt(e,(150+G.wave*25)*m.dmg,'fire');break;
  case'heart':h.hp=Math.min(h.maxHp,h.hp+h.maxHp*.5);G.castle=Math.min(G.castleMax,G.castle+2);break;
  case'boots':h.boots=10;break;case'clock':G.buffs.clock=4;break;case'crown':h.crown=8;h.inv=Math.max(h.inv,8);break;
  case'chest':{const v=Math.round((30+G.wave*7)*m.coin);G.coinsN+=v;text(h.x,h.y-56,'+'+v+' 💰','#ffe066',14);break}
  case'star':h.ult=0;break;case'rage':G.buffs.rage=10;break}}
function updFx(dt){for(const f of G.fx){f.life-=dt;if(f.t==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92}else if(f.t==='ring')f.r=f.R*(1-f.life/f.max)}G.fx=G.fx.filter(f=>f.life>0);for(const t of G.texts){t.life-=dt;t.y-=26*dt}G.texts=G.texts.filter(t=>t.life>0);if(G.fx.length>500)G.fx.splice(0,G.fx.length-500)}

/* ================= 업데이트 ================= */
function update(dt){G.time+=dt;for(const k in G.buffs)if(G.buffs[k]>0)G.buffs[k]-=dt;G.shake=Math.max(0,G.shake-dt);if(G.shake<=0)G.shakeA=0;G.castleHit=Math.max(0,G.castleHit-dt);
  updHero(dt);if(G.menu)return;
  if(G.state==='prep'){G.prepT-=dt;if(G.prepT<=0)startWave()}
  if(G.state==='wave'&&G.spawnQ.length){G.spawnT-=dt;while(G.spawnT<=0&&G.spawnQ.length){const q=G.spawnQ.shift();spawnFromQ(q);G.spawnT+=q.delay}}
  updSoldiers(dt);updEnemies(dt);if(!G||G.state==='over')return;updTowers(dt);updProjs(dt);updCoins(dt);updFx(dt);
  G.enemies=G.enemies.filter(e=>!e.dead);
  if(G.state==='wave'&&!G.spawnQ.length&&!G.enemies.length)endWave()}

/* ================= 그리기 ================= */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function bar(x,y,w,h,p,c){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-w/2-1,y-1,w+2,h+2);ctx.fillStyle=c;ctx.fillRect(x-w/2,y,w*clamp(p,0,1),h)}
function ell(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()}
function drawSpot(s){const light=G.M.light;const near=G.standSpot===s;
  ctx.save();ctx.setLineDash([6,4]);ctx.lineWidth=2.5;ctx.strokeStyle=near?'#ffe066':light?'rgba(60,40,10,.55)':'rgba(255,255,255,.65)';ctx.fillStyle=near?'rgba(255,224,102,.25)':'rgba(0,0,0,.15)';rr(s.x-19,s.y-19,38,38,8);ctx.fill();ctx.stroke();ctx.restore();
  ctx.fillStyle=light?'rgba(60,40,10,.6)':'rgba(255,255,255,.8)';ctx.font='20px Jua,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('+',s.x,s.y+1);
  if(near&&G.stand>0){ctx.strokeStyle='#ffe066';ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(s.x,s.y,25,-Math.PI/2,-Math.PI/2+Math.PI*2*(G.stand/.4));ctx.stroke()}}
function drawTower(t){const b=TT[t.k];const ev=t.lv===4;const o=lgOff(t);
  ell(t.x,t.y+17,22,8,'rgba(0,0,0,.3)');
  if(ev){const g=ctx.createRadialGradient(t.x,t.y,5,t.x,t.y,34);g.addColorStop(0,'rgba(255,220,100,.55)');g.addColorStop(1,'rgba(255,220,100,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(t.x,t.y,34,0,7);ctx.fill()}
  ctx.fillStyle='#5d6070';ctx.beginPath();ctx.arc(t.x,t.y+6,20,0,7);ctx.fill();
  ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(t.x,t.y+1,18,0,7);ctx.fill();
  ctx.strokeStyle=ev?'#ffd24a':'rgba(255,255,255,.4)';ctx.lineWidth=ev?3:2;ctx.stroke();
  if(t.aimA!=null){const a=t.aimA,cx=t.x,cy=t.y+1;ctx.fillStyle=ev?'#ffd24a':'#fff';ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*26,cy+Math.sin(a)*26);ctx.lineTo(cx+Math.cos(a+.38)*18,cy+Math.sin(a+.38)*18);ctx.lineTo(cx+Math.cos(a-.38)*18,cy+Math.sin(a-.38)*18);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;ctx.stroke()}
  if(t.buff>1){ctx.strokeStyle='rgba(255,240,170,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(t.x,t.y-28,12,4,0,0,7);ctx.stroke()}
  const s=(ev?35:31)*(1+t.anim*.1);drawE(ev?b.ee:b.e,t.x+o.x,t.y-5+o.y,s);
  if(!ev){for(let i=0;i<t.lv;i++){ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.arc(t.x-(t.lv-1)*5+i*10,t.y+22,3.4,0,7);ctx.fill();ctx.strokeStyle='#7a4b00';ctx.lineWidth=1.2;ctx.stroke()}}

  if(t.frozen>0){ctx.fillStyle='rgba(180,225,255,.6)';rr(t.x-21,t.y-26,42,46,8);ctx.fill();drawE('🧊',t.x+14,t.y-20,15)}}
function drawEnemy(e){const s=e.size;const bob=e.fly?Math.sin(G.time*8+e.bob)*3.5:Math.abs(Math.sin(e.bob))*2.8;const fy=e.fly?18:0;const o=lgOff(e);

  ell(e.x,e.y+s*.38,s*.42*(e.fly?.7:1),s*.14,'rgba(0,0,0,.28)');
  const x=e.x+o.x,y=e.y-bob-fy+o.y;
  if(e.boss){ctx.strokeStyle=e.boss===2?'rgba(255,60,60,.75)':'rgba(255,170,60,.75)';ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(e.x,e.y+s*.38,s*.55,s*.2,0,0,7);ctx.stroke()}
  drawE(e.T.e,x,y,s,e.face<0,e.burrowT>0?.35:null);

  if(e.poisT>0){ctx.fillStyle='rgba(110,230,80,.28)';ctx.beginPath();ctx.arc(x,y,s*.5,0,7);ctx.fill();if(Math.random()<.06)G.fx.push({t:'p',x:x+R(-6,6),y:y-5,vx:0,vy:-20,life:.4,max:.4,c:'#7f5',s:2.5})}
  if(e.stun>0)drawE('💫',x,y-s*.75,14);
  if(e.hp<e.maxHp&&!e.boss)bar(e.x,y-s*.7,s,4,e.hp/e.maxHp,e.arm>=.5?'#9fb4ff':'#ff4d4d');
  if(e.boss)bar(e.x,y-s*.68,s*1.1,5,e.hp/e.maxHp,'#ff3355')}
function drawHero(){const h=G.hero,T=HT[h.k];
  if(h.dead>0){drawE('👻',CASTLE.x,CASTLE.y-56,26,false,.7);ctx.fillStyle='#fff';ctx.font='14px Jua,sans-serif';ctx.textAlign='center';ctx.fillText('부활 '+Math.ceil(h.dead),CASTLE.x,CASTLE.y-80);return}

  if(h.boots>0&&Math.random()<.3)G.fx.push({t:'p',x:h.x+R(-8,8),y:h.y+14,vx:0,vy:0,life:.3,max:.3,c:'#bfe8ff',s:3});

  ctx.fillStyle=h.shadow>0?'#5b3d8f':T.col;ctx.beginPath();ctx.ellipse(x,y+3+bob*.3,17,14,0,0,7);ctx.fill();ctx.strokeStyle=h.hurtT>0?'#ff4d4d':'#ffe066';ctx.lineWidth=2.5;ctx.stroke();
  const recent=h.lgS!=null&&G.time-h.lgS<.35;

  drawE(T.e,x,y-12+bob,37);

function drawCastle(){const c=CASTLE;ell(c.x,c.y+16,48,10,'rgba(0,0,0,.3)');
  ctx.fillStyle='#8d8f9c';rr(c.x-58,c.y-6,116,26,6);ctx.fill();ctx.fillStyle='#a9abb8';for(let i=0;i<7;i++)ctx.fillRect(c.x-56+i*17,c.y-12,10,8);
  drawE('🏰',c.x,c.y-14,58);
  if(G.castleHit>0){ctx.fillStyle=`rgba(255,40,40,${G.castleHit})`;ctx.beginPath();ctx.arc(c.x,c.y-10,46,0,7);ctx.fill()}
  const fl=Math.sin(G.time*5)*2;ctx.fillStyle='#e23b3b';ctx.beginPath();ctx.moveTo(c.x+20,c.y-58);ctx.lineTo(c.x+34+fl,c.y-53);ctx.lineTo(c.x+20,c.y-48);ctx.fill();ctx.strokeStyle='#553';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(c.x+20,c.y-60);ctx.lineTo(c.x+20,c.y-40);ctx.stroke()}
function drawProj(p){switch(p.type){
  case'arrow':case'harrow':ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang||0);ctx.strokeStyle=p.type==='harrow'?'#ffe066':'#7a4a1c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(5,0);ctx.stroke();ctx.fillStyle='#ddd';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(3,-3);ctx.lineTo(3,3);ctx.fill();if(p.burn){ctx.fillStyle='#ff8a2a';ctx.beginPath();ctx.arc(7,0,2.5,0,7);ctx.fill()}ctx.restore();break;
  case'ball':ctx.fillStyle='#222';ctx.beginPath();ctx.arc(p.x,p.y,4.5,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(p.x-1.5,p.y-1.5,1.6,0,7);ctx.fill();break;
  case'orb':case'horb':{const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,8);g.addColorStop(0,'#fff');g.addColorStop(.4,p.type==='horb'?'#d7b5ff':'#b67bff');g.addColorStop(1,'rgba(140,80,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,8,0,7);ctx.fill();break}
  case'shard':ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang||0);ctx.fillStyle='#bfe9ff';ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(0,-3);ctx.lineTo(-6,0);ctx.lineTo(0,3);ctx.fill();ctx.restore();break;
  case'dart':ctx.fillStyle='#7be04f';ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();break;
  case'star':ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);ctx.fillStyle='#cfd6e6';ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?2:6,a=i*Math.PI/4;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.fill();ctx.restore();break}}
function drawFx(f){const a=clamp(f.life/f.max,0,1);switch(f.t){
  case'p':ctx.globalAlpha=a;ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,f.s,0,7);ctx.fill();ctx.globalAlpha=1;break;
  case'ring':ctx.strokeStyle=`rgba(${f.c},${a})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.stroke();break;
  case'boom':{const r=f.r*(1.1-a*.5);const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,r);g.addColorStop(0,`rgba(255,255,220,${a*.9})`);g.addColorStop(.5,`rgba(${f.c},${a*.6})`);g.addColorStop(1,`rgba(${f.c},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,r,0,7);ctx.fill();break}
  case'line':ctx.strokeStyle=`rgba(200,230,255,${a})`;ctx.lineWidth=3;ctx.shadowColor='#8cf';ctx.shadowBlur=8;ctx.beginPath();f.pts.forEach((q,i)=>{const jx=i&&i<f.pts.length-1?R(-4,4):0;i?ctx.lineTo(q[0]+jx,q[1]+jx):ctx.moveTo(q[0],q[1])});ctx.stroke();ctx.shadowBlur=0;ctx.lineWidth=1;ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.stroke();break;
  case'slash':ctx.strokeStyle=`rgba(230,240,255,${a})`;ctx.lineWidth=4;ctx.beginPath();if(f.full)ctx.arc(f.x,f.y,f.r*(1.2-a*.4),0,7);else ctx.arc(f.x,f.y,f.r*.85,f.a-1.1,f.a+1.1);ctx.stroke();break;
  case'streak':ctx.strokeStyle=`rgba(255,240,170,${a})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(f.x+18*a,f.y-60*a-6);ctx.lineTo(f.x,f.y);ctx.stroke();break;
  case'ghost':ctx.globalAlpha=a*.4;drawE(HT[G.hero.k].e,f.x,f.y-12,37);ctx.globalAlpha=1;break}}
function render(){ctx.setTransform(SC*DPR,0,0,SC*DPR,0,0);
  if(!G){drawTitle();return}
  if(G.shake>0)ctx.translate(R(-1,1)*G.shakeA,R(-1,1)*G.shakeA);
  ctx.drawImage(G.bg,0,0,W,H);
  const showEntry=G.state==='prep'||(G.state==='wave'&&G.time%1<.5&&G.spawnQ.length);
  if(showEntry)for(const p of G.paths){const q=posAt(p,30);drawE('⚠️',q.x,q.y,22,false,.6+.4*Math.sin(G.time*6))}
  drawCastle();
  for(const s of G.spots){if(s.t)continue;drawSpot(s)}
  if(G.menu&&G.menu.t&&G.menu.t.k!=='mine'){const t=G.menu.t;ctx.fillStyle='rgba(255,255,255,.12)';ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(t.x,t.y,tst(t).range,0,7);ctx.fill();ctx.stroke()}

  '유물':()=>RELICS.map(r=>`<div class="row"><span class="ic">${r.i}</span><span class="tx"><div class="nm">${r.n}</div><div class="ds">${r.d}</div></span></div>`).join(''),
  '카드':()=>CARDS.map(c=>`<div class="row"><span class="ic">${c.i}</span><span class="tx"><div class="nm">${c.n} <span style="font-size:.7em;color:${['#9fb0d0','#58b4ff','#c084ff'][c.r]}">${RAR[c.r]}</span></div><div class="ds">${c.d}</div></span></div>`).join(''),
  '방법':()=>`<div class="row"><span class="ic">👆</span><span class="tx"><div class="nm">이동</div><div class="ds">화면 아무 곳이나 손가락으로 끌면 영웅이 움직입니다. 영웅은 가까운 적을 자동으로 공격합니다.</div></span></div><div class="row"><span class="ic">🏗️</span><span class="tx"><div class="nm">건설·강화</div><div class="ds">점선 칸 위에 잠시 서 있으면 건설 메뉴가 열립니다. 이미 지은 타워 위에 서면 강화·진화·판매를 할 수 있어요. 3단계 다음은 진화입니다.</div></span></div><div class="row"><span class="ic">💰</span><span class="tx"><div class="nm">금화</div><div class="ds">적이 떨어뜨린 금화는 영웅이 다가가야 주워집니다. 웨이브가 끝나면 남은 금화는 자동으로 모입니다.</div></span></div><div class="row"><span class="ic">🎴</span><span class="tx"><div class="nm">카드와 유물</div><div class="ds">웨이브마다 카드 한 장, 5·10웨이브 정예를 이기면 유물 하나를 고릅니다. 판이 끝날 때까지 유지돼요.</div></span></div><div class="row"><span class="ic">✨</span><span class="tx"><div class="nm">필살기</div><div class="ds">오른쪽 아래 버튼이 빛나면 누르세요. 영웅마다 필살기가 다릅니다.</div></span></div><div class="row"><span class="ic">💎</span><span class="tx"><div class="nm">보석</div><div class="ds">이기든 지든 보석이 쌓입니다. 영웅 해금과 영구 강화에 쓰세요.</div></span></div>`};
let codexTab='방법';
function openCodex(){hide('sTitle');show('sCodex');$('codexTabs').innerHTML=Object.keys(CODEX).map(k=>`<button class="${k===codexTab?'on':''}" data-t="${k}">${k}</button>`).join('');$('codexList').innerHTML=CODEX[codexTab]()}
$('codexTabs').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;codexTab=b.dataset.t;openCodex()});

function openPause(){if(!G||G.state==='over'||G.overlay)return;if(G.menu)closeBuild();G.paused=true;joy=null;
  $('pauseInfo').innerHTML=`<div class="kv"><span>전장</span><span>${G.M.e} ${G.M.n}</span></div><div class="kv"><span>웨이브</span><span>${G.wave}/15</span></div><div class="kv"><span>지금까지 보석</span><span>💎 ${G.gems}</span></div>`+
  (G.relics.length?`<div class="sec">유물</div>`+G.relics.map(r=>`<div class="row"><span class="ic">${r.i}</span><span class="tx"><div class="nm">${r.n}</div><div class="ds">${r.d}</div></span></div>`).join(''):'')+
  (G.cards.length?`<div class="sec">카드 ${G.cards.length}장</div><div style="font-size:1.4em;line-height:1.5">${G.cards.map(c=>`<span title="${c.n}">${c.i}</span>`).join(' ')}</div>`:'');
  soundLabel();show('sPause')}
$('bPause').onclick=openPause;
$('bResume').onclick=()=>{hide('sPause');if(G)G.paused=false};
$('bQuit').onclick=()=>{if(!G)return;hide('sPause');G.paused=false;finishRun(false)};
$('bSpeed').onclick=()=>{if(!G)return;G.speed=G.speed===1?2:1;$('bSpeed').textContent=G.speed+'x'};
$('bGo').onclick=()=>{if(!G||G.state!=='prep')return;G.coinsN+=Math.floor(G.prepT)*2;startWave()};
$('ultBtn').onclick=useUlt;
$('bPlay').onclick=openMaps;$('bHero').onclick=openHeroes;$('bShop').onclick=openShop;$('bCodex').onclick=openCodex;
const toggleSound=()=>{save.sound=save.sound?0:1;store();soundLabel();initAudio();sfx('t',880,.08)};
$('bSound').onclick=toggleSound;$('bSound2').onclick=toggleSound;

/* ================= 입력 ================= */
let cvRect=cv.getBoundingClientRect();
cv.addEventListener('pointerdown',ev=>{initAudio();cvRect=cv.getBoundingClientRect();if(!G||G.menu||G.overlay||G.paused||G.state==='over'||joy)return;joy={id:ev.pointerId,sx:ev.clientX,sy:ev.clientY,x:ev.clientX,y:ev.clientY};try{cv.setPointerCapture(ev.pointerId)}catch(e){}ev.preventDefault()});
cv.addEventListener('pointermove',ev=>{if(!joy||ev.pointerId!==joy.id)return;joy.x=ev.clientX;joy.y=ev.clientY;const dx=joy.x-joy.sx,dy=joy.y-joy.sy,L=hyp(dx,dy),mx=60*SC;if(L>mx){joy.sx+=dx*(1-mx/L);joy.sy+=dy*(1-mx/L)}});
const endJoy=ev=>{if(joy&&ev.pointerId===joy.id)joy=null};cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
document.addEventListener('pointerdown',initAudio,{once:true});
addEventListener('keydown',ev=>{keys[ev.key]=1;if(ev.key===' '){useUlt();ev.preventDefault()}if(ev.key==='Escape')openPause()});addEventListener('keyup',ev=>{keys[ev.key]=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.state!=='over'&&!G.paused&&!G.overlay)openPause()});
document.addEventListener('touchmove',ev=>{if(!ev.target.closest('.panel'))ev.preventDefault()},{passive:false});

/* ================= 루프 ================= */
let last=performance.now(),hudT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G&&G.state!=='over'&&!G.paused&&!G.overlay){for(let i=0;i<G.speed&&G&&G.state!=='over';i++)update(dt)}
  else if(G&&G.state==='over')updFx(dt);
  if(G){hudT-=dt;if(hudT<=0){hudT=.08;hud()}}
  render();requestAnimationFrame(loop)}
resize();goTitle();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{for(const k in SPR)delete SPR[k]});
requestAnimationFrame(loop);
</script>
</body>
